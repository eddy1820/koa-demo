global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'koa-demo-monitor'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Koa Demo Application
  - job_name: 'koa-demo-app'
    scrape_interval: 10s
    static_configs:
      - targets: ['app:3000']
    metrics_path: '/metrics'
