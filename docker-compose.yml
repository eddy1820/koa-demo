services:
  postgres:
    image: postgres:16-alpine
    container_name: koa-demo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 5s
      retries: 10
      interval: 3s
      start_period: 30s
    networks:
      - koa-demo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: koa-demo-app-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: test1
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production-min-32-chars
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reload
      - ./src:/app/src
      - ./tsconfig.json:/app/tsconfig.json
      # Use anonymous volume for node_modules to avoid conflicts with host
      - /app/node_modules
    networks:
      - koa-demo-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: koa-demo-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - koa-demo-network
    depends_on:
      - app

  grafana:
    image: grafana/grafana:10.2.2
    container_name: koa-demo-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - koa-demo-network
    depends_on:
      - prometheus

volumes:
  postgres_data_dev:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  koa-demo-network:
    driver: bridge
